name: ${COMPOSE_PROJECT_NAME:-love-notes}

services:
  api:
    image: love-notes-server:${IMAGE_TAG:-local}
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${SERVER_BIND_ADDRESS:-127.0.0.1}:${SERVER_HTTP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Duser.timezone=UTC}
      MYSQL_URL: ${MYSQL_URL:?MYSQL_URL is required}
      MYSQL_USERNAME: ${MYSQL_USERNAME:?MYSQL_USERNAME is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_POOL_SIZE: ${MYSQL_POOL_SIZE:-20}
      MYSQL_MIN_IDLE: ${MYSQL_MIN_IDLE:-4}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL: ${REDIS_SSL:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:?WECHAT_APP_ID is required}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?WECHAT_APP_SECRET is required}
      COS_BUCKET: ${COS_BUCKET:?COS_BUCKET is required}
      COS_REGION: ${COS_REGION:?COS_REGION is required}
      COS_SECRET_ID: ${COS_SECRET_ID:?COS_SECRET_ID is required}
      COS_SECRET_KEY: ${COS_SECRET_KEY:?COS_SECRET_KEY is required}
      TIMELINE_CURSOR_SECRET: ${TIMELINE_CURSOR_SECRET:?TIMELINE_CURSOR_SECRET is required}
      INTERNAL_OPERATION_TOKEN_HASH: ${INTERNAL_OPERATION_TOKEN_HASH:-}
      MEDIA_PROCESSING_POLL_MS: ${MEDIA_PROCESSING_POLL_MS:-5000}
      MEDIA_CLEANUP_POLL_MS: ${MEDIA_CLEANUP_POLL_MS:-3600000}
      ACCOUNT_DELETION_POLL_MS: ${ACCOUNT_DELETION_POLL_MS:-600000}
      MEDIA_TRASH_RETENTION_DAYS: ${MEDIA_TRASH_RETENTION_DAYS:-30}
      MEDIA_ORPHAN_RETENTION_HOURS: ${MEDIA_ORPHAN_RETENTION_HOURS:-24}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /api/v1/actuator/health HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3;
          grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    mem_limit: ${APP_MEMORY_LIMIT:-768m}
    cpus: ${APP_CPU_LIMIT:-1.0}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-20m}
        max-file: ${LOG_MAX_FILES:-5}
    networks:
      - backend

networks:
  backend:
    driver: bridge
