name: ${COMPOSE_PROJECT_NAME:-love-notes}

services:
  api:
    image: love-notes-server:${IMAGE_TAG:-production}
    restart: unless-stopped
    init: true
    ports:
      - "${SERVER_BIND_ADDRESS:-127.0.0.1}:${SERVER_HTTP_PORT:-8080}:${SERVER_PORT:-8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ${APP_ENV_FILE:-./.env}
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >
          exec 3<>/dev/tcp/127.0.0.1/$${SERVER_PORT:-8080};
          printf 'GET /api/v1/actuator/health HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3;
          grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    mem_limit: ${APP_MEMORY_LIMIT:-768m}
    cpus: ${APP_CPU_LIMIT:-1.0}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-20m}
        max-file: ${LOG_MAX_FILES:-5}
    networks:
      - backend

networks:
  backend:
    driver: bridge
